  <body>
    <script>
      // Tema Chrónos — aplicado antes da primeira pintura (sem flash)
      (function () {
        try {
          var c = localStorage.getItem('chronos:theme') || 'system';
          var resolved = c === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : c;
          var r = document.documentElement;
          r.classList.add(resolved);
          r.dataset.theme = resolved;
          r.style.colorScheme = resolved;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', resolved === 'light' ? '#FAFAFA' : '#090909');
        } catch (e) {}
      })();
    </script>

<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Chrónos</title>
  <meta name="theme-color" content="#111111" />
  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100%;
      background: #111 !important;
      color: #fff !important;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      text-align: center;
    }
    .logo {
      width: 88px; height: 88px;
      border-radius: 22px;
      background: #22ff88;
      color: #000;
      font-size: 42px;
      font-weight: 900;
      line-height: 88px;
      margin-bottom: 24px;
    }
    h1 { font-size: 32px; margin: 0 0 12px; color: #fff; }
    p { font-size: 16px; color: #ccc; margin: 0 0 8px; max-width: 300px; }
    .btn {
      margin-top: 28px;
      background: #22ff88;
      color: #000;
      font-weight: 800;
      font-size: 16px;
      padding: 14px 32px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-block;
    }
    .ok {
      margin-top: 20px;
      padding: 10px 16px;
      background: #1a3d2a;
      border: 1px solid #22ff88;
      border-radius: 12px;
      color: #22ff88;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">C</div>
    <h1>Chrónos</h1>
    <p>Conecta. Partilha. Cria.</p>
    <p>Site no GitHub — sem Lovable.</p>
    <div class="ok">✓ Página a funcionar</div>
    <a class="btn" href="https://github.com/zacariasguilhermejoao-ui/chronos-social">Código no GitHub</a>
  </div>
</body>
</html>
